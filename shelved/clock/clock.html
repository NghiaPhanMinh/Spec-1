<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f2"><title>Pause — Generative Clockwork</title><link rel="stylesheet" href="style.css?v=transfer-13"><script defer src="vendor/p5.min.js"></script><script defer src="art.js?v=sweep-6"></script><script defer src="presence.js?v=bounded-15"></script></head><body><main id="art" aria-label="Generative letter-noise clockwork. Press Space to stop or resume time. Camera starts automatically. Raise an open palm to resume time."></main><video id="video" autoplay muted playsinline></video><div id="notice" role="status" class="sr-only"></div><script>addEventListener('keydown',e=>{if(e.code==='BracketRight'&&!e.repeat){e.preventDefault();parent.postMessage('toggle-adjustments',location.origin)}if(e.code==='Digit2'&&!e.repeat)parent.postMessage('switch-mode',location.origin)})</script><script>addEventListener('wheel',e=>{if(e.ctrlKey||parent===window)return;e.preventDefault();parent.postMessage({type:'artwork-scroll',direction:e.deltaY>0?1:-1},location.origin)},{passive:false});addEventListener('keydown',e=>{if(['Backspace','ArrowUp','PageUp'].includes(e.key)&&parent!==window){e.preventDefault();parent.postMessage({type:'artwork-scroll',direction:-1},location.origin)}})</script><script>let sceneTouchY=0;addEventListener('touchstart',e=>sceneTouchY=e.touches[0].clientY,{passive:true});addEventListener('touchmove',e=>{if(parent===window)return;e.preventDefault();const delta=sceneTouchY-e.touches[0].clientY;if(Math.abs(delta)>45){sceneTouchY=e.touches[0].clientY;parent.postMessage({type:'artwork-scroll',direction:delta>0?1:-1},location.origin)}},{passive:false})</script><script>addEventListener('click',e=>{if(parent!==window)parent.postMessage({type:'background-ripple',x:e.clientX,y:e.clientY},location.origin)})</script></body></html>
